<body data-page="search">
  <div class="page-shell">
    <header class="site-header">
      <nav class="navbar">
        <a class="brand" href="index.html">
          <span class="brand-mark">MP</span>
          <span>台股脈動</span>
        </a>
        <div class="nav-links">
        </div>
      </nav>
    </header>

    <main>
      <section class="subpage-hero">
        <p class="eyebrow">個股搜尋</p>
        <h1>輸入部分代號或名稱查詢個股</h1>
        <p class="hero-text">不必輸入完整內容，例如輸入 30、台積或積電，即可搜尋符合的上市與上櫃股票。</p>
      </section>

      <section class="section">
        <article class="panel-card">
          <form id="stock-search-form" class="search-form">
            <input id="stock-search-input" class="search-input" type="search" placeholder="輸入部分代號或名稱，例如 30、台積或積電" autocomplete="off">
            <button class="btn btn-primary" type="submit">搜尋</button>
          </form>
          <p id="search-status" class="source-note">可輸入部分代號或名稱搜尋，輸入後會自動列出結果</p>
        </article>
      </section>

      <section class="section">
        <article class="panel-card">
          <div class="card-title-row">
            <h3>搜尋結果</h3>
            <span class="chip chip-blue">最多 20 筆</span>
          </div>
          <div id="search-results" class="search-results"></div>
        </article>
      </section>

      <section class="section search-detail-section">
        <article class="panel-card detail-panel-card">
          <div class="card-title-row">
            <h3>個股詳情</h3>
            <span class="chip chip-gold">技術 / 籌碼 / 基本面 / 脈絡</span>
          </div>
          <div id="stock-detail" class="stock-detail-empty">
            請先輸入股票代號或名稱，再查看個股詳細資料。
          </div>
        </article>
      </section>
    </main>
  </div>
