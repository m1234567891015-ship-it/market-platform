<body data-page="us-stock-search">
  <div class="page-shell">
    <header class="site-header">
      <nav class="navbar">
        <a class="brand" href="index.html">
          <span class="brand-mark">MP</span>
          <span>Market Pulse</span>
        </a>
        <div class="nav-links">
        </div>
      </nav>
    </header>
    <main>
      <section class="section search-section">
        <article class="panel-card">
          <div class="card-title-row">
            <div>
              <p class="panel-kicker">US stock search</p>
              <h1>美股與 ETF 搜尋</h1>
            </div>
            <span class="chip chip-blue">Yahoo / Nasdaq / NYSE</span>
          </div>
          <form id="us-stock-search-form" class="search-form us-stock-search-form">
            <input id="us-stock-search-input" class="search-input us-stock-search-input" type="search" name="q" placeholder="輸入 AAPL、MSFT、ETF 或公司名稱" autocomplete="off">
            <button class="btn" type="submit">搜尋</button>
          </form>
          <p id="us-stock-search-status" class="source-note">請輸入美股或 ETF 代號 / 名稱後開始搜尋。</p>
          <div id="us-search-results" class="search-results"></div>
        </article>
      </section>
      <section class="section search-detail-section">
        <article class="panel-card detail-panel-card">
          <div class="card-title-row">
            <h3>美股個股詳情</h3>
            <span class="chip chip-gold">報價 / 技術 / AI 摘要</span>
          </div>
          <div id="us-stock-detail" class="stock-detail-empty">選擇一檔美股或 ETF 後，這裡會顯示行情與分析。</div>
