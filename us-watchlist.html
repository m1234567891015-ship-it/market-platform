<body data-page="us-watchlist">
  <div class="page-shell">
    <header class="site-header">
      <nav class="navbar">
        <a class="brand" href="index.html">
          <span class="brand-mark">MP</span>
          <span>Market Pulse</span>
        </a>
        <div class="nav-links">
        </div>
      </nav>
    </header>
    <main>
      <section class="section">
        <article class="panel-card">
          <div class="card-title-row">
            <div>
              <p class="panel-kicker">US watchlist</p>
              <h1>美股自選清單</h1>
            </div>
            <div class="watchlist-heading-actions">
              <button id="us-watchlist-analysis-refresh" class="watchlist-analysis-refresh" type="button">更新 AI 分析</button>
              <span id="us-watchlist-count" class="chip chip-gold">0 檔</span>
            </div>
          </div>
          <p id="us-watchlist-status" class="source-note">從美股搜尋頁加入標的後，這裡會集中追蹤報價、技術分析與 AI 摘要。</p>
          <div id="us-watchlist-ai-summary" class="watchlist-ai-summary"></div>
          <div id="us-watchlist-grid" class="watchlist-grid"></div>
        </article>
      </section>
      <section class="section">
        <article class="panel-card detail-panel-card">
          <div class="card-title-row">
            <h3>自選股詳情</h3>
            <span class="chip chip-blue">Yahoo Finance</span>
          </div>
          <div id="us-watchlist-detail" class="stock-detail-empty">點選自選股卡片後，這裡會顯示個股詳情。</div>
          <div id="us-watchlist-results" class="search-results"></div>
        </article>
      </section>
      <section class="section">
        <article class="panel-card portfolio-simulator-card">
          <div class="card-title-row">
            <div>
              <p class="panel-kicker">US portfolio simulator</p>
              <h3>美股投組模擬</h3>
            </div>
            <button id="us-portfolio-simulator-reset" class="portfolio-reset" type="button">重設模擬</button>
          </div>
          <div id="us-portfolio-simulator-summary" class="portfolio-simulator-summary"></div>
          <div id="us-portfolio-simulator-table" class="portfolio-simulator-table"></div>
        </article>
      </section>
    </main>
  </div>
<script src="market-pulse-esm-loader.js?v=td02-full-esm-20260901-1"></script>
