name: P2 release provenance gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_baseline:
        description: Run the external-provider full baseline
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  provenance-and-deterministic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DERIVATIVES_DB_PATH: /tmp/market-platform-regression.sqlite3
      MARKET_PULSE_CACHE_FILE: /tmp/market-platform-cache.json
      MARKET_PULSE_DISABLE_BACKGROUND: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate provenance manifest and evidence binding
        run: python regression/test_p2_release_provenance.py
      - name: Check Python syntax
        run: python -m py_compile app.py builders.py fetchers.py parsers.py regression/p2_release_provenance.py regression/test_p2_release_provenance.py
      - name: Check JavaScript syntax
        shell: bash
        run: for file in js/*.js; do node --check "$file"; done
      - name: Run P0 and P1 regression
        shell: bash
        run: |
          python -m regression.test_p0_quant_integrity
          node regression/test_p1_options_liquidity.js
          node regression/test_p1_options_execution.js
          node regression/test_p1_point_in_time.js
          node regression/test_options_strategy_analyzer.js
      - name: Run P2 and TD02 regression
        shell: bash
        run: |
          python -m regression.test_p2_backend_boundaries
          node regression/test_p2_frontend_contract.js
          python -m regression.test_p2_artifact_hygiene
          python -m regression.test_td02_01_dependency_matrix
      - name: Run unit, security, and E2E gates
        shell: bash
        run: |
          python -m unittest test_derivatives_platform.py
          python security_guardrail_check.py
          python e2e_smoke.py
      - name: Run offline canonical baseline
        run: python regression/verify_against_baseline.py --quick
      - name: Verify worktree diff formatting
        shell: bash
        run: git diff --check

  full-live-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_baseline == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DERIVATIVES_DB_PATH: /tmp/market-platform-regression.sqlite3
      MARKET_PULSE_CACHE_FILE: /tmp/market-platform-cache.json
      MARKET_PULSE_DISABLE_BACKGROUND: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r regression/requirements-regression.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Install deterministic frontend fonts
        shell: bash
        run: |
          set -euo pipefail
          FONT_DIR="$HOME/.local/share/fonts/market-pulse"
          mkdir -p "$FONT_DIR"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/google/fonts/b950a7257470b900078f2bf3223823a8602de7e1/ofl/notosanstc/NotoSansTC%5Bwght%5D.ttf" \
            --output "$FONT_DIR/NotoSansTC-wght.ttf"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/google/fonts/2861cb7b12f90c0a294a12ed666e381e2211872f/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" \
            --output "$FONT_DIR/SpaceGrotesk-wght.ttf"
          test "$(git hash-object "$FONT_DIR/NotoSansTC-wght.ttf")" = "82943579ad39c281212df8f14ac999824694a6ab"
          test "$(git hash-object "$FONT_DIR/SpaceGrotesk-wght.ttf")" = "a1b2e6c26093066510a31147e7aec9abdc8d6c5e"
          fc-cache -f "$FONT_DIR"
          fc-match -f '%{family}\n' "Noto Sans TC" | grep -F "Noto Sans TC"
          fc-match -f '%{family}\n' "Space Grotesk" | grep -F "Space Grotesk"
      - name: Run canonical full baseline
        run: python regression/verify_against_baseline.py --full
