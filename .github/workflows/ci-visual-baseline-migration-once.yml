name: CI visual baseline migration once

on:
  push:
    branches: [ci-visual-baseline-migration-01]
    paths:
      - .github/workflows/ci-visual-baseline-migration-once.yml

permissions:
  contents: write

jobs:
  migrate-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DERIVATIVES_DB_PATH: /tmp/market-platform-regression.sqlite3
      MARKET_PULSE_CACHE_FILE: /tmp/market-platform-cache.json
      MARKET_PULSE_DISABLE_BACKGROUND: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r regression/requirements-regression.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install deterministic frontend fonts
        shell: bash
        run: |
          set -euo pipefail
          FONT_DIR="$HOME/.local/share/fonts/market-pulse"
          mkdir -p "$FONT_DIR"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/google/fonts/b950a7257470b900078f2bf3223823a8602de7e1/ofl/notosanstc/NotoSansTC%5Bwght%5D.ttf" \
            --output "$FONT_DIR/NotoSansTC-wght.ttf"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/google/fonts/2861cb7b12f90c0a294a12ed666e381e2211872f/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" \
            --output "$FONT_DIR/SpaceGrotesk-wght.ttf"
          test "$(git hash-object "$FONT_DIR/NotoSansTC-wght.ttf")" = "82943579ad39c281212df8f14ac999824694a6ab"
          test "$(git hash-object "$FONT_DIR/SpaceGrotesk-wght.ttf")" = "a1b2e6c26093066510a31147e7aec9abdc8d6c5e"
          fc-cache -f "$FONT_DIR"
          fc-match -f '%{family}\n' "Noto Sans TC" | grep -F "Noto Sans TC"
          fc-match -f '%{family}\n' "Space Grotesk" | grep -F "Space Grotesk"

      - name: Rebuild visual baseline from frozen HAR
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("regression").resolve()))
          import frontend_check
          from playwright.sync_api import sync_playwright

          manifest = json.loads(
              frontend_check.FRONTEND_MANIFEST_PATH.read_text(encoding="utf-8")
          )
          baseline_by_file = {page["file"]: page for page in manifest["pages"]}
          pages = list(frontend_check.PAGES)
          if len(pages) != 21 or manifest.get("page_count") != 21:
              raise SystemExit(
                  f"expected 21 pages; pages={len(pages)} manifest={manifest.get('page_count')}"
              )

          def capture_once():
              results = {}
              with frontend_check.start_server(
                  port=frontend_check.FIXED_SERVER_PORT
              ) as server, sync_playwright() as pw:
                  browser = pw.chromium.launch()
                  try:
                      for page_file in pages:
                          print(f"[baseline-migration] {page_file}", flush=True)
                          result = frontend_check._visit_page(
                              browser, server.base_url, page_file, "compare"
                          )
                          expected = baseline_by_file[page_file]
                          if result["console_errors"]:
                              raise SystemExit(
                                  f"{page_file}: local console errors: {result['console_errors'][:3]}"
                              )
                          if result["counts"] != expected["counts"]:
                              raise SystemExit(
                                  f"{page_file}: DOM counts changed: "
                                  f"expected={expected['counts']} current={result['counts']}"
                              )
                          results[page_file] = result
                  finally:
                      browser.close()
              return results

          first = capture_once()
          second = capture_once()

          for page_file in pages:
              diff = frontend_check._pixel_diff_pct(
                  first[page_file]["screenshot_bytes"],
                  second[page_file]["screenshot_bytes"],
              )
              print(
                  f"[baseline-migration] repeatability {page_file}: {diff:.4f}%"
              )
              if diff > frontend_check.PIXEL_DIFF_FAIL_THRESHOLD_PCT:
                  raise SystemExit(
                      f"{page_file}: same-runner repeatability {diff:.4f}% exceeds "
                      f"{frontend_check.PIXEL_DIFF_FAIL_THRESHOLD_PCT:.2f}%"
                  )
              target = frontend_check.SCREENSHOT_DIR / f"{page_file}.png"
              target.write_bytes(second[page_file]["screenshot_bytes"])
          PY

      - name: Verify migration scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path

          expected = {
              f"regression/baseline/screenshots/{path.name}.png"
              for path in Path(".").glob("*.html")
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain"], text=True
              ).splitlines()
              if line
          }
          unexpected = changed - expected
          missing = expected - changed
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {sorted(unexpected)}")
          if missing:
              raise SystemExit(f"expected baseline screenshots not changed: {sorted(missing)}")
          if len(changed) != 21:
              raise SystemExit(f"expected 21 screenshot changes, got {len(changed)}")
          print("BASELINE_SCOPE_OK 21/21 screenshots only")
          PY
          git diff --stat -- regression/baseline/screenshots

      - name: Commit canonical Ubuntu baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regression/baseline/screenshots/*.png
          git commit -m "test: migrate visual baseline to pinned github runner"
          git push origin HEAD:ci-visual-baseline-migration-01
