name: P1 quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DERIVATIVES_DB_PATH: /tmp/market-platform-regression.sqlite3
      MARKET_PULSE_CACHE_FILE: /tmp/market-platform-cache.json
      MARKET_PULSE_DISABLE_BACKGROUND: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r regression/requirements-regression.txt

      - name: Check Python syntax
        run: >-
          python -m py_compile app.py routes_twse.py data_source_status.py
          test_derivatives_platform.py regression/test_data_source_contracts.py
          regression/api_page_contract_check.py regression/negative_stability_check.py
          regression/runtime_loader_check.py regression/verify_against_baseline.py

      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do node --check "$file"; done
          node --check regression/test_q5_quant_math.js

      - name: Run unit and offline contract tests
        run: |
          python -m unittest test_derivatives_platform.py regression.test_data_source_contracts regression.test_q5_decision_quality
          node regression/test_q5_quant_math.js

      - name: Run security guardrails
        run: python security_guardrail_check.py

      - name: Run E2E smoke
        run: python e2e_smoke.py

      - name: Run offline quick baseline
        run: python regression/verify_against_baseline.py --quick

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install deterministic frontend fonts
        shell: bash
        run: |
          set -euo pipefail
          FONT_DIR="$HOME/.local/share/fonts/market-pulse"
          mkdir -p "$FONT_DIR"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/google/fonts/b950a7257470b900078f2bf3223823a8602de7e1/ofl/notosanstc/NotoSansTC%5Bwght%5D.ttf" \
            --output "$FONT_DIR/NotoSansTC-wght.ttf"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/google/fonts/2861cb7b12f90c0a294a12ed666e381e2211872f/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" \
            --output "$FONT_DIR/SpaceGrotesk-wght.ttf"
          test "$(git hash-object "$FONT_DIR/NotoSansTC-wght.ttf")" = "82943579ad39c281212df8f14ac999824694a6ab"
          test "$(git hash-object "$FONT_DIR/SpaceGrotesk-wght.ttf")" = "a1b2e6c26093066510a31147e7aec9abdc8d6c5e"
          fc-cache -f "$FONT_DIR"
          fc-match -f '%{family}\n' "Noto Sans TC" | grep -F "Noto Sans TC"
          fc-match -f '%{family}\n' "Space Grotesk" | grep -F "Space Grotesk"

      - name: Run frontend visual gate
        run: >-
          python regression/frontend_check.py --compare
          --report "$RUNNER_TEMP/frontend-compare.json"
          --diagnostic-dir "$RUNNER_TEMP/frontend-diagnostics"

      - name: Run interaction gate
        run: python regression/interaction_check.py --compare

      - name: Run runtime and loader gate
        run: python regression/runtime_loader_check.py --compare

      - name: Run negative stability gate
        run: python regression/negative_stability_check.py --compare

      - name: Upload frontend comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-compare-report
          path: |
            ${{ runner.temp }}/frontend-compare.json
            ${{ runner.temp }}/frontend-diagnostics/
          if-no-files-found: ignore
